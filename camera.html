<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      #image-capture-modal {
        /* Add some basic styling to the modal */
        background-color: #fff;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      }
      
      #image-capture-canvas {
        /* Add some basic styling to the canvas */
        border: 1px solid #ddd;
      }
      
      </style>
</head>
<body>
    <!-- Button to trigger modal -->
<button id="capture-btn" class="btn btn-primary">Capture Image</button>

<!-- Modal form -->
<div id="image-capture-modal" class="modal fade">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Image Capture</h5>
        <button type="button" class="close" data-dismiss="modal">&times;</button>
      </div>
      <div class="modal-body">
        <form id="image-capture-form">
          <div class="form-group">
            <label for="image-name">Image Name:</label>
            <input type="text" id="image-name" name="image_name" class="form-control">
          </div>
          <div class="form-group">
            <label for="image-capture">Capture Image:</label>
            <button id="image-capture-btn" class="btn btn-primary">Capture</button>
            <canvas id="image-capture-canvas" width="400" height="300"></canvas>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
        <button id="save-image-btn" class="btn btn-primary">Save Image</button>
      </div>
    </div>
  </div>
</div>


<script src="camera.js"></script>
</body>
</html>
