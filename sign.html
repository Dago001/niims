<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Digital Signature</title>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@2.3.2/dist/signature_pad.min.js"></script>
    <style>
        #signature-pad {
            border: 1px solid #000;
            width: 400px;
            height: 200px;
        }
    </style>
</head>
<body>
    <h2>Sign Below</h2>
    <canvas id="signature-pad" style="margin-left: 180px;margin-top: 110px;"></canvas><br/>
    <div style="margin-left: 180px;"><button id="clear">Clear</button>
    <button id="save">Save</button></div>


    <script>
        var canvas = document.getElementById('signature-pad');
        var signaturePad = new SignaturePad(canvas);

        document.getElementById('clear').addEventListener('click', function () {
            signaturePad.clear();
        });

        document.getElementById('save').addEventListener('click', function () {
            if (signaturePad.isEmpty()) {
                alert("Please provide a signature first.");
            } else {
                var dataURL = signaturePad.toDataURL();
                var u_id = 12321;
                fetch('save_signature.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ image: dataURL ,u_id: u_id})
                })
                .then(response => response.json())
                .then(data => {
                    alert(data.message);
                })
                .catch(error => {
                    console.error('Error:', error);
                });
            }
        });
    </script>
</body>
</html>
